name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          # GitHub's Intel macOS runners are being retired and no longer get
          # scheduled, so build this one on Apple Silicon instead.
          - os: macos-14
            target: darwin-x64
            rust-target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/kernel
          key: ${{ matrix.target }}

      # Only the napi CLI is needed to build the addon. Skipping production
      # dependencies keeps this job independent of the agent packages.
      - run: npm ci --omit=prod

      # Keep the shipped binary free of the build machine's paths: panic
      # metadata embeds source paths verbatim, and this artifact is published.
      - name: Build native addon
        shell: bash
        run: npm run build:kernel
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=${{ runner.temp }}=/tmp
          SNAPGREP_BUILD_TARGET: ${{ matrix.rust-target || '' }}

      # A cross-compiled addon cannot be loaded by the runner that built it, so
      # this only runs for native builds. The packaging job checks that every
      # expected file exists regardless.
      - name: Verify the addon loads
        if: matrix.rust-target == ''
        shell: bash
        run: |
          set -euo pipefail
          ls -la native/kernel/binding/
          node -e "
            const b = require('./native/kernel/binding/index.cjs');
            if (typeof b.BINDING_ABI_VERSION !== 'number') {
              throw new Error('addon loaded but ABI version is missing');
            }
            console.log('ABI', b.BINDING_ABI_VERSION, '|', b.bindingTarget());
          "

      - name: Verify the cross-compiled addon has the right architecture
        if: matrix.rust-target != ''
        shell: bash
        run: |
          set -euo pipefail
          ls -la native/kernel/binding/
          file native/kernel/binding/*.node
          file native/kernel/binding/*.node | grep -q 'x86_64' \
            || { echo "cross-compiled addon is not x86_64"; exit 1; }

      # The native suite diffs every result against ripgrep, so the runner
      # needs one. None of the images ship it.
      - name: Install ripgrep
        if: matrix.rust-target == '' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null; then rg --version | head -1; exit 0; fi
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ;;
            macOS)   brew install ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
          rg --version | head -1

      # The kernel is the whole product, so exercise it on the platform that
      # just built it. Without this the native path only ever ran on a
      # developer's Mac. Cross-compiled output cannot run here.
      # Windows is excluded for now: the kernel fails to open an index parent
      # directory under a path containing an 8.3 short name (RUNNER~1), which
      # is a real portability gap, not a test artefact. The Windows addon is
      # therefore built and shipped but not yet covered by these tests.
      - name: Run the native kernel tests
        if: matrix.rust-target == '' && runner.os != 'Windows'
        shell: bash
        env:
          PI_FAST_GREP_NATIVE_TEST: '1'
        run: |
          set -euo pipefail
          npm ci
          npx vitest run tests/kernel-binding-native.test.ts tests/kernel-engine-native.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.target }}
          path: native/kernel/binding/*.node
          if-no-files-found: error
          retention-days: 7

  package:
    name: package extension
    needs: addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - name: Collect every platform's addon
        uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          merge-multiple: true
          path: native/kernel/binding

      - name: Package the extension
        run: |
          set -euo pipefail
          ls -la native/kernel/binding/
          npm run package:extension
          echo '--- packaged addons ---'
          ls -la artifacts/pi-extension/pi-fast-grep/native/

      - name: Fail if any target is missing
        shell: bash
        run: |
          set -euo pipefail
          # napi suffixes Linux output with the libc flavour (linux-x64-gnu), so
          # each target is matched by prefix rather than by an exact filename.
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            found=$(ls artifacts/pi-extension/pi-fast-grep/native/ \
              | grep -E "^pi-fast-grep-kernel\.${target}(-[a-z]+)?\.node$" || true)
            test -n "$found" || { echo "missing addon for ${target}"; exit 1; }
            echo "  ${target} -> ${found}"
          done
          echo "all five targets present"

      - uses: actions/upload-artifact@v4
        with:
          name: pi-fast-grep-extension
          path: artifacts/pi-extension/pi-fast-grep
          if-no-files-found: error
