<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <clipPath id="typing">
      <rect x="28" y="58" width="0" height="26">
        <animate attributeName="width" values="0;0;330;330;330" keyTimes="0;0.03;0.20;0.97;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <linearGradient id="slowbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bb8009"/>
      <stop offset="1" stop-color="#e3b341"/>
    </linearGradient>
    <linearGradient id="fastbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
  </defs>

  <rect width="820" height="280" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="819" height="279" rx="9.5" fill="none" stroke="#30363d"/>
  <rect x="1" y="1" width="818" height="36" rx="9" fill="#161b22"/>
  <rect x="1" y="30" width="818" height="7" fill="#161b22"/>
  <line x1="1" y1="37" x2="819" y2="37" stroke="#30363d"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="19" r="6" fill="#febc2e"/>
  <circle cx="64" cy="19" r="6" fill="#28c840"/>
  <text x="410" y="24" fill="#7d8590" font-size="12.5" text-anchor="middle">17 MB repository — 4,000 files</text>

  <g clip-path="url(#typing)" font-size="15">
    <text x="28" y="77" fill="#7ee787">$</text>
    <text x="48" y="77" fill="#c9d1d9">grep </text>
    <text x="93" y="77" fill="#a5d6ff">"createServer"</text>
  </g>
  <rect x="332" y="62" width="9" height="19" fill="#c9d1d9">
    <animate attributeName="opacity" values="1;1;0;1;0;1;0;0" keyTimes="0;0.20;0.23;0.26;0.29;0.32;0.35;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <line x1="28" y1="100" x2="792" y2="100" stroke="#21262d"/>

  <text x="28" y="140" fill="#8b949e" font-size="14">ripgrep</text>
  <rect x="120" y="126" width="560" height="18" rx="3" fill="#161b22"/>
  <rect x="120" y="126" width="0" height="18" rx="3" fill="url(#slowbar)">
    <animate attributeName="width" values="0;0;560;560;0" keyTimes="0;0.21;0.72;0.97;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="694" y="140" fill="#e3b341" font-size="14" opacity="0">147.7 ms
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.71;0.74;0.97;1" dur="7s" repeatCount="indefinite"/>
  </text>

  <text x="28" y="182" fill="#c9d1d9" font-size="14">snapgrep</text>
  <rect x="120" y="168" width="560" height="18" rx="3" fill="#161b22"/>
  <rect x="120" y="168" width="0" height="18" rx="3" fill="url(#fastbar)">
    <animate attributeName="width" values="0;0;8;8;0" keyTimes="0;0.21;0.225;0.97;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="140" y="182" fill="#56d364" font-size="14" opacity="0">2.1 ms
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.235;0.97;1" dur="7s" repeatCount="indefinite"/>
  </text>
  <text x="205" y="182" fill="#3fb950" font-size="13" font-weight="bold" opacity="0">72× faster — same results, byte for byte
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.78;0.97;1" dur="7s" repeatCount="indefinite"/>
  </text>

  <line x1="28" y1="212" x2="792" y2="212" stroke="#21262d"/>
  <text x="28" y="240" fill="#7d8590" font-size="12.5">Bars are drawn to true scale. The green one is 8 pixels wide because that is what 2.1 ms looks like</text>
  <text x="28" y="260" fill="#7d8590" font-size="12.5">next to 147.7 ms. P50 of 7 runs, alternating, same snapshot, identical output limits.</text>
</svg>
